name: SOLO Android Build
on:
  push:
    paths:
      - 'apps/solo-android/**'
      - '.github/workflows/solo-android-build.yml'
  pull_request:
    paths:
      - 'apps/solo-android/**'
      - '.github/workflows/solo-android-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/solo-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Robolectric's Android 16 (API 36) sandbox requires Java 21.
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android 16 (API 36) platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit, contract and UI tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace
      - name: Lint
        run: ./gradlew :app:lintRelease
      # Unsigned outputs only. The upload key is never stored in this repository.
      - name: Build debug APK and unsigned release bundle
        run: ./gradlew :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: solo-ai-android-reports
          path: |
            apps/solo-android/app/build/reports/
            apps/solo-android/app/build/screenshots/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: solo-ai-debug-apk
          path: apps/solo-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: solo-ai-release-bundle-unsigned
          path: apps/solo-android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
