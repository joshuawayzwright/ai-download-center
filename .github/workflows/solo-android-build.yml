name: SOLO Android Build
on:
  push:
    paths:
      - 'apps/solo-android/**'
      - '.github/workflows/solo-android-build.yml'
  pull_request:
    paths:
      - 'apps/solo-android/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build debug APK
        run: gradle -p apps/solo-android :app:assembleDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: solo-ai-debug-apk
          path: apps/solo-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
