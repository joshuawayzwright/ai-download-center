name: WrightWayz Android build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-app/**'
      - 'data/tools.json'
      - '.github/workflows/android-play-build.yml'
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - 'data/tools.json'
      - '.github/workflows/android-play-build.yml'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Install Android SDK 36
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Prepare optional release signing
        env:
          KEYSTORE_B64: ${{ secrets.WRIGHTWAYZ_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/wrightwayz-release.jks"
            echo "WRIGHTWAYZ_KEYSTORE_PATH=$RUNNER_TEMP/wrightwayz-release.jks" >> "$GITHUB_ENV"
          fi
      - name: Build debug APK and release AAB
        env:
          WRIGHTWAYZ_KEYSTORE_PASSWORD: ${{ secrets.WRIGHTWAYZ_KEYSTORE_PASSWORD }}
          WRIGHTWAYZ_KEY_ALIAS: ${{ secrets.WRIGHTWAYZ_KEY_ALIAS }}
          WRIGHTWAYZ_KEY_PASSWORD: ${{ secrets.WRIGHTWAYZ_KEY_PASSWORD }}
        run: gradle -p android-app :app:assembleDebug :app:bundleRelease --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wrightwayz-debug-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: wrightwayz-release-aab
          path: android-app/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
