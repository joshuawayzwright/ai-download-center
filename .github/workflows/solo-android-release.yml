name: SOLO Android Release

# Builds a SIGNED Android App Bundle (.aab) for Google Play from apps/solo-android.
# Runs only when started by hand (Actions > SOLO Android Release > Run workflow).
# It never uploads to Google Play: download the AAB from the run and upload it in Play Console.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SOLO_UPLOAD_KEYSTORE_BASE64  the upload keystore (solo-ai-upload-2026.jks), base64-encoded
#   SOLO_UPLOAD_STORE_PASSWORD   keystore password
#   SOLO_UPLOAD_KEY_ALIAS        key alias (solo-upload)
#   SOLO_UPLOAD_KEY_PASSWORD     key password (same as the keystore password for a PKCS12 keystore)

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (must be higher than the last one uploaded to Play; 5 is live)"
        required: true
        default: "6"

permissions:
  contents: read

concurrency:
  group: solo-android-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/solo-android
    env:
      SOLO_VERSION_CODE: ${{ inputs.version_code }}
    steps:
      - name: Check inputs and secrets
        working-directory: .
        env:
          KEYSTORE: ${{ secrets.SOLO_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SOLO_UPLOAD_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SOLO_UPLOAD_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SOLO_UPLOAD_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing SOLO_UPLOAD_KEYSTORE_BASE64"
          [ -n "$STORE_PASSWORD" ] || missing="$missing SOLO_UPLOAD_STORE_PASSWORD"
          [ -n "$KEY_ALIAS" ] || missing="$missing SOLO_UPLOAD_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ] || missing="$missing SOLO_UPLOAD_KEY_PASSWORD"
          if [ -n "$missing" ]; then echo "::error::Missing repository secrets:$missing"; exit 1; fi
          [[ "$SOLO_VERSION_CODE" =~ ^[0-9]+$ ]] && [ "$SOLO_VERSION_CODE" -gt 5 ] \
            || { echo "::error::version_code must be a whole number above 5"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android 16 (API 36) platform
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Restore upload keystore
        env:
          KEYSTORE: ${{ secrets.SOLO_UPLOAD_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "SOLO_UPLOAD_STORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Unit tests and signed release bundle
        env:
          SOLO_UPLOAD_STORE_PASSWORD: ${{ secrets.SOLO_UPLOAD_STORE_PASSWORD }}
          SOLO_UPLOAD_KEY_ALIAS: ${{ secrets.SOLO_UPLOAD_KEY_ALIAS }}
          SOLO_UPLOAD_KEY_PASSWORD: ${{ secrets.SOLO_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew :app:testDebugUnitTest :app:bundleRelease --stacktrace
      - name: Check the bundle is signed with the upload key
        env:
          SOLO_UPLOAD_STORE_PASSWORD: ${{ secrets.SOLO_UPLOAD_STORE_PASSWORD }}
          SOLO_UPLOAD_KEY_ALIAS: ${{ secrets.SOLO_UPLOAD_KEY_ALIAS }}
        run: |
          aab=$(ls app/build/outputs/bundle/release/*.aab)
          jarsigner -verify "$aab" | grep -q "jar verified" || { echo "::error::The bundle is not signed"; exit 1; }
          want=$(keytool -list -keystore "$SOLO_UPLOAD_STORE_FILE" -storepass "$SOLO_UPLOAD_STORE_PASSWORD" -alias "$SOLO_UPLOAD_KEY_ALIAS" -v | sed -n 's/.*SHA256: //p' | head -1)
          got=$(keytool -printcert -jarfile "$aab" | sed -n 's/.*SHA256: //p' | head -1)
          [ -n "$want" ] && [ "$want" = "$got" ] || { echo "::error::The bundle is not signed with the upload key"; exit 1; }
          cp "$aab" "$GITHUB_WORKSPACE/solo-ai-vc${SOLO_VERSION_CODE}.aab"
          {
            echo "### Signed bundle ready"
            echo "- File: \`solo-ai-vc${SOLO_VERSION_CODE}.aab\` (versionCode ${SOLO_VERSION_CODE})"
            echo "- Upload key SHA-256: \`${got}\`. Compare it with Play Console > App signing > Upload key."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
      - uses: actions/upload-artifact@v7
        with:
          name: solo-ai-release-vc${{ inputs.version_code }}
          path: solo-ai-vc${{ inputs.version_code }}.aab
          if-no-files-found: error
          retention-days: 7
