name: SOLO Core Tests
on:
  push:
    paths:
      - 'apps/solo-core/**'
      - '.github/workflows/solo-core-tests.yml'
  pull_request:
    paths:
      - 'apps/solo-core/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/solo-core test
