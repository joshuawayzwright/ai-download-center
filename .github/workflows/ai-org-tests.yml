name: AI Org Tests
on:
  push:
    paths:
      - 'apps/ai-org/**'
      - '.github/workflows/ai-org-tests.yml'
  pull_request:
    paths:
      - 'apps/ai-org/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm --prefix apps/ai-org run validate
      - run: npm --prefix apps/ai-org test
      - run: npm --prefix apps/ai-org run build:web
