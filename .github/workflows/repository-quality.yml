name: Repository quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify required project files
        shell: bash
        run: |
          required=(
            README.md
            SECURITY.md
            CONTRIBUTING.md
            LICENSE
            index.html
            featured-thanks.html
            privacy.html
            terms.html
            app.js
            config.js
            data/tools.json
            robots.txt
            sitemap.xml
            .github/CODEOWNERS
            .github/dependabot.yml
          )

          for file in "${required[@]}"; do
            test -f "$file" || { echo "Missing required file: $file"; exit 1; }
          done

      - name: Check for unresolved merge markers
        shell: bash
        run: |
          if grep -R -n -E '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo "Unresolved merge markers found."
            exit 1
          fi

      - name: Detect common committed secret patterns
        shell: bash
        run: |
          if grep -R -n -E '(BEGIN (RSA|OPENSSH|EC) PRIVATE KEY|ghp_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|sk_(live|test)_[A-Za-z0-9]{16,})' --exclude-dir=.git .; then
            echo "Potential committed secret detected."
            exit 1
          fi

      - name: Validate production payment configuration
        shell: bash
        run: |
          grep -q "featuredCheckoutUrl: 'https://buy.stripe.com/" config.js
          grep -q "billingPortalUrl: 'https://billing.stripe.com/" config.js
          grep -q "supportEmail: 'hello@thesoloserviceprovider.com.au'" config.js
          grep -q '\$99 USD' index.html
          grep -q '7-day free trial' index.html
          grep -q 'Stripe customer portal' terms.html
          grep -q 'hello@thesoloserviceprovider.com.au' privacy.html
          grep -q 'hello@thesoloserviceprovider.com.au' terms.html

      - name: Validate catalog
        run: node scripts/validate-catalog.mjs

      - name: Validate core JSON
        run: node -e "JSON.parse(require('fs').readFileSync('data/tools.json','utf8')); console.log('data/tools.json is valid JSON')"

      - name: Check critical metadata
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import xml.etree.ElementTree as ET

          class HeadMetadataParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.description = False
                  self.canonical = False

              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  if tag == "meta" and attrs.get("name", "").lower() == "description" and attrs.get("content", "").strip():
                      self.description = True
                  if tag == "link" and attrs.get("rel", "").lower() == "canonical" and attrs.get("href", "").strip():
                      self.canonical = True

          parser = HeadMetadataParser()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))

          if not parser.description:
              raise SystemExit("Missing non-empty meta description in index.html")
          if not parser.canonical:
              raise SystemExit("Missing canonical link in index.html")

          robots = Path("robots.txt").read_text(encoding="utf-8")
          if "Sitemap:" not in robots:
              raise SystemExit("robots.txt does not declare a sitemap")

          root = ET.parse("sitemap.xml").getroot()
          if not root.tag.endswith("urlset"):
              raise SystemExit("sitemap.xml root element is not urlset")

          print("Critical metadata checks passed")
          PY
