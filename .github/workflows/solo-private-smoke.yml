name: SOLO private AI smoke test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify deployed private SOLO conversation and access controls
        env:
          VERCEL_ENV: preview
          SOLO_PRIVATE_TEST_ENABLED: 'true'
          # Include the temporary Vercel share parameter for a protected preview.
          SOLO_SMOKE_TARGET_URL: ${{ secrets.SOLO_TEST_URL }}
          SOLO_PRIVATE_TEST_TOKEN: ${{ secrets.SOLO_TEST_TOKEN }}
        run: node powerhouse-website/scripts/solo-private-smoke.cjs
