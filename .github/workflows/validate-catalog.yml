name: Validate catalog

on:
  pull_request:
    paths: ['data/**', 'index.html', 'scripts/validate-catalog.mjs']
  push:
    branches: [main]
    paths: ['data/**', 'index.html', 'scripts/validate-catalog.mjs']

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check data/tools.json
        run: node scripts/validate-catalog.mjs
