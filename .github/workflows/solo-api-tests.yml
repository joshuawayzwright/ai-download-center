name: SOLO website and API tests
on:
  push:
    branches: [main]
    paths:
      - 'powerhouse-website/**'
      - 'scripts/verify-powerhouse-package.py'
      - 'scripts/summarize-launch-interest.cjs'
      - 'data/solo-commerce-catalogue.json'
      - 'data/solo-knowledge.json'
      - '.github/workflows/solo-api-tests.yml'
  pull_request:
    paths:
      - 'powerhouse-website/**'
      - 'scripts/verify-powerhouse-package.py'
      - 'scripts/summarize-launch-interest.cjs'
      - 'data/solo-commerce-catalogue.json'
      - 'data/solo-knowledge.json'
      - '.github/workflows/solo-api-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test powerhouse-website/tests/*.test.cjs
      - run: python3 scripts/verify-powerhouse-package.py
