name: SOLO AI API security tests
on:
  push:
    branches: [main]
    paths:
      - 'powerhouse-website/api/solo-chat.js'
      - 'powerhouse-website/tests/solo-chat.test.cjs'
      - '.github/workflows/solo-api-tests.yml'
  pull_request:
    paths:
      - 'powerhouse-website/api/solo-chat.js'
      - 'powerhouse-website/tests/solo-chat.test.cjs'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test powerhouse-website/tests/solo-chat.test.cjs
