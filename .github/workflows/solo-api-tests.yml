name: SOLO AI database tests
# The SOLO AI API itself now lives in the private solo-commerce repository (it serves
# thesoloserviceprovider.com.au and the Android app). This repository keeps the Supabase
# migrations, email templates and the member-access tool, tested here against PGlite.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/solo-api-tests.yml'
      - 'supabase/**'
      - 'tests/solo-database/**'
  pull_request:
    paths:
      - '.github/workflows/solo-api-tests.yml'
      - 'supabase/**'
      - 'tests/solo-database/**'
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tests/solo-database
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/solo-database/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
