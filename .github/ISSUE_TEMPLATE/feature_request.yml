name: Feature request
description: Suggest a new catalog feature or repo improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Share the problem, the idea, and why it matters.
  - type: input
    id: title
    attributes:
      label: Feature summary
      placeholder: Add X to the catalog
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: notes
    attributes:
      label: Additional context
