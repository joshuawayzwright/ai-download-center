<path d="M632 582 754 548 710 621 618 642Z" fill="#21a8ff" filter="url(#glow)"/>
<path d="M968 582 846 548 890 621 982 642Z" fill="#21a8ff" filter="url(#glow)"/>
<path d="M800 538 870 688 800 754 730 688Z" fill="url(#armor)" stroke="#815914" stroke-width="5"/>
