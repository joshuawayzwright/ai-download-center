<path d="M800 394 719 441l-35 62 37 21 34-59 45-26 37 22-21 36h-50l-36 62-10 17 80 47 81-47 37-64-38-22-34 59-46 26-37-22 22-37h49l36-62 10-17Z"
 fill="url(#gold)" stroke="#ffe080" stroke-width="5"/>
