<path d="M440 900Q430 365 800 150q370 215 360 750l-184-92-176 78-176-78Z" fill="url(#armor)" stroke="#b9852d" stroke-width="12"/>
<path d="M520 782Q520 376 800 232q280 144 280 550L930 700 800 760 670 700Z" fill="#05080c" stroke="#e2af4b" stroke-width="7"/>
