<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="t d">
<title id="t">SOLO AI hero artwork</title><desc id="d">Futuristic hooded AI sentinel in black, gold and electric blue.</desc>
<defs>
 <radialGradient id="space"><stop stop-color="#123451"/><stop offset=".43" stop-color="#07131e"/><stop offset="1" stop-color="#020406"/></radialGradient>
 <linearGradient id="gold" x1=".15" y1="0" x2=".9" y2="1"><stop stop-color="#fff1a6"/><stop offset=".18" stop-color="#f0c45e"/><stop offset=".55" stop-color="#a86e1a"/><stop offset="1" stop-color="#f1bd4e"/></linearGradient>
 <linearGradient id="armor" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#26323d"/><stop offset=".38" stop-color="#080d12"/><stop offset=".72" stop-color="#151c23"/><stop offset="1" stop-color="#030507"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="16" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="45"/></filter>
</defs>
<rect width="1600" height="1200" rx="64" fill="url(#space)"/>
<circle cx="800" cy="480" r="430" fill="none" stroke="#d69a2e" stroke-width="18" opacity=".75"/>
<circle cx="800" cy="480" r="386" fill="none" stroke="#1c9cea" stroke-width="8" opacity=".75" filter="url(#glow)"/>
<ellipse cx="800" cy="1040" rx="580" ry="90" fill="#147bc0" opacity=".18" filter="url(#soft)"/>
